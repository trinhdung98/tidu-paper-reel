//  PAPER-REEL PIECE — 9:16, 30fps. The voice is the clock: VOICE (voice.json) is injected by build.mjs.
//  One scene per spoken line (SCENES[<line id>] in src/scenes.js); SPLITS add a second cut inside a line on a word.

const FPS = 30, W = 1080, H = 1920;
const DURATION = VOICE.duration;
const NFRAMES = Math.round(DURATION * FPS);

const HAND = '"Chalkboard SE", "Comic Sans MS", cursive';
const CX = 540;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
// VW(id, word, n): the n-th (0-based) occurrence of `word` in line `id` -> { t0, t1 } (falls back to the line)
const VW = (id, word, n = 0) => { const L = VL(id), nw = (s) => s.toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}']/gu, ''), k = nw(word); const hits = L.words.filter((w) => nw(w.w) === k); return hits[n] || hits[0] || { t0: L.t0, t1: L.t1 }; };
const CUT = (id) => Math.max(0, VL(id).t0 - 0.1);   // a line's scene starts just before it is spoken

function mulberry32(a) {

// Concentric Wi-Fi waves pulsing outward
function ttWifiPulse(cx, cy, radius, speed = 1, col = PR.glow, alpha = 0.8) {
  const t = TT * speed;
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const f = ((t * 0.8 + i * 0.33) % 1);
    const r = radius * 0.2 + f * radius * 0.8;
    const a = (1 - f) * alpha;
    ctx.globalAlpha = Math.max(0, a);
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI * 0.75, -Math.PI * 0.25);
    ctx.stroke();
  }
  ctx.restore();
}

// Thick network cable connecting router to internet servers
function ttCable(x1, y1, x2, y2, o = {}) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  if (o.torn) {
    // Left segment
    ctx.save();
    ctx.strokeStyle = '#2b4460';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(mx - 45, my);
    ctx.stroke();

    // Right segment
    ctx.beginPath();
    ctx.moveTo(mx + 45, my);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();

    // Jagged paper-tear edges at break
    pp(pG([[mx - 48, my - 12], [mx - 32, my - 4], [mx - 46, my + 6], [mx - 34, my + 14], [mx - 52, my + 12]]), PR.red, { key: 'tear_L', shadow: false, tex: 0.3 });
    pp(pG([[mx + 48, my - 12], [mx + 32, my - 4], [mx + 46, my + 6], [mx + 34, my + 14], [mx + 52, my + 12]]), PR.red, { key: 'tear_R', shadow: false, tex: 0.3 });

    // Sparks popping out
    for (let s = 0; s < 5; s++) {
      const sa = s * 1.2 + TT * 8;
      const sr = 24 + (s % 3) * 14;
      const sx = mx + Math.cos(sa) * sr, sy = my + Math.sin(sa) * sr;
      pp(pE(sx, sy, 5, 5), PR.mustard, { shadow: false, tex: false });
    }
  } else {
    // Continuous solid cable
    ctx.save();
    ctx.strokeStyle = '#2b4460';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();

    // Glowing cyan data packets travelling from left to right
    for (let p = 0; p < 4; p++) {
      const f = ((TT * 0.9 + p * 0.25) % 1);
      const px = lerp(x1 + 30, x2 - 30, f), py = lerp(y1, y2, f);
      pp(pR(px - 14, py - 6, 28, 12, 5), PR.glow, { key: 'pkt' + p, sb: 6, sy: 2, tex: false });
    }
  }
}
